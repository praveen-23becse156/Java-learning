<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Career Website</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav">
  <a class="nav__brand" href="index.html" style="text-decoration:none;color:#fff;"><span class="badge">CW</span> Career Website</a>
  <div class="nav__links"><a class="btn-link" href="signup.html">Create account</a></div>
</nav>

<div class="wrap auth-shell">
  <div class="card">
    <span class="badge badge--coral">WELCOME BACK</span>
    <h2 style="margin-top:.6rem;">Log in</h2>

    <div class="error-msg" id="errorMsg"></div>

    <form id="loginForm">
      <div class="form-field">
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">Log in</button>
    </form>
    <p class="muted" style="margin-top:1rem;font-size:.9rem;">New here? <a href="signup.html"><strong>Create an account</strong></a></p>
  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errorMsg = document.getElementById("errorMsg");
  errorMsg.style.display = "none";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) {
      errorMsg.textContent = data.error || "Something went wrong.";
      errorMsg.style.display = "block";
      return;
    }
    window.location.href = "dashboard.html";
  } catch (err) {
    errorMsg.textContent = "Could not reach the server. Is it running?";
    errorMsg.style.display = "block";
  }
});
</script>
</body>
</html>
